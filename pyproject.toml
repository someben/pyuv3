[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyuv3"
version = "0.2.0"
description = "Uniswap V3 position fees, withdrawable tokens, and pool liquidity profiles from the subgraph"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Ben Gimpert"}]
requires-python = ">=3.9"
dependencies = ["backoff>=2.2", "gql[requests]>=3.4", "numpy>=1.24", "pandas>=1.5"]
keywords = ["uniswap", "uniswap-v3", "defi", "liquidity", "market-microstructure", "thegraph"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/someben/pyuv3"
Author = "https://blog.someben.com/"

[tool.setuptools]
packages = ["pyuv3"]
